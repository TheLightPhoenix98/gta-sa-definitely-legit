name: Build Windows EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build exe
        run: |
          pyinstaller --onefile --windowed --name "GTA_SA_Setup" --icon assets/app_icon.ico --add-data "assets;assets" installer.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: GTA_SA_Setup
          path: dist/GTA_SA_Setup.exe
